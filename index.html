<!DOCTYPE html>
<html lang="en" ng-app="todoApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  </head>
  <body ng-controller="TodoController as todo">
    <main class="todo-app">
      <h1>My To-Do List</h1>
      <p class="subtitle">Add a task and keep track of your work.</p>

      <form class="task-form" ng-submit="todo.addTask()">
        <input
          type="text"
          ng-model="todo.taskName"
          placeholder="What do you need to do?"
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>

      <p class="message" aria-live="polite">{{ todo.message }}</p>

      <ul class="task-list">
        <li
          ng-repeat="task in todo.tasks"
          class="task-item"
          ng-class="{ completed: task.completed }"
        >
          <input
            type="checkbox"
            ng-checked="task.completed"
            aria-label="Mark {{ task.name }} as completed"
            ng-click="todo.toggleTask(task.id)"
          />
          <span>{{ task.name }}</span>
          <button type="button" class="delete-button" ng-click="todo.deleteTask(task.id)">
            Delete
          </button>
        </li>
      </ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
